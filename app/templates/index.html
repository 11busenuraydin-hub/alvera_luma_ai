<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALVÉRA | Luma AI</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f7f5ef;
            color: #493c30;
            margin: 0;
            padding: 30px 15px;
        }

        .container {
            max-width: 650px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            color: #526b4c;
        }

        .subtitle {
            text-align: center;
            margin-bottom: 25px;
        }

        #chat {
            height: 300px;
            overflow-y: auto;
            border: 1px solid #e5e5e5;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            white-space: pre-wrap;
        }

        .message {
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .user {
            color: #526b4c;
        }

        .assistant {
            color: #493c30;
        }

        textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 10px;
            resize: vertical;
            font-family: inherit;
        }

        button {
            background: #526b4c;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            margin-top: 10px;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>ALVÉRA</h1>

    <p class="subtitle">
        Natural Radiance, Healthy Skin<br>
        Luma AI Cilt Bakım Asistanı
    </p>

    <div id="chat" aria-live="polite">
        <div class="message assistant">
            <strong>Luma AI:</strong>
            Merhaba! 🌿 ALVÉRA'ya hoş geldiniz.
            Cilt bakımı hakkında bana sorular sorabilirsiniz.
        </div>
    </div>

    <textarea
        id="message"
        rows="3"
        placeholder="Cilt bakımı hakkında bir soru yazın..."
    ></textarea>

    <button id="sendButton" onclick="sendMessage()">
        Gönder
    </button>
</div>

<script>
    async function sendMessage() {
        const input = document.getElementById("message");
        const chat = document.getElementById("chat");
        const button = document.getElementById("sendButton");

        const message = input.value.trim();

        if (!message || button.disabled) return;

        function addMessage(sender, text, className) {
            const div = document.createElement("div");
            div.className = "message " + className;

            const label = document.createElement("strong");
            label.textContent = sender + ": ";

            div.appendChild(label);
            div.appendChild(document.createTextNode(text));

            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;

            return div;
        }

        addMessage("Siz", message, "user");

        input.value = "";
        button.disabled = true;

        const loading = addMessage(
            "Luma AI",
            "Yanıt hazırlanıyor...",
            "assistant"
        );

        try {
            const response = await fetch("/api/chat", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    message: message
                })
            });

            const data = await response.json();

            loading.remove();

            if (!response.ok) {
                throw new Error(
                    data.error || "Bir hata oluştu."
                );
            }

            addMessage(
                "Luma AI",
                data.reply || "Yanıt alınamadı.",
                "assistant"
            );

        } catch (error) {
            loading.remove();

            addMessage(
                "Luma AI",
                "Üzgünüm, şu anda yanıt veremiyorum. Lütfen tekrar deneyin.",
                "assistant"
            );

        } finally {
            button.disabled = false;
            input.focus();
        }
    }
</script>

</body>
</html>
